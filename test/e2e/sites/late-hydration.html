<!doctype html>
<meta charset="utf-8" />
<title>Linen Shirt — Mock Late Store</title>
<link rel="stylesheet" href="_store.css" />
<main>
  <h1>LINEN SHIRT</h1>
  <div id="price">loading…</div>
  <div id="guidewrap"></div>
  <div id="chartwrap"></div>
</main>
<script>
  // Nothing useful exists at document_idle. The price arrives late, the size
  // guide later still, and the chart only when the guide is clicked — the shape
  // that made the Open Chart button need a page refresh to appear.
  setTimeout(() => {
    document.getElementById('price').innerHTML = '<div class="price">€79,90</div>';
  }, 900);
  setTimeout(() => {
    document.getElementById('guidewrap').innerHTML = '<span class="sizeguide" id="guide">Size guide &rsaquo;</span>';
    document.getElementById('guide').addEventListener('click', () => {
      document.getElementById('chartwrap').innerHTML = `
        <table><thead><tr><th>Size</th><th>Chest</th><th>Waist</th><th>Sleeve</th></tr></thead>
        <tbody>
          <tr><td>S</td><td>104 cm</td><td>98 cm</td><td>63 cm</td></tr>
          <tr><td>M</td><td>110 cm</td><td>104 cm</td><td>64 cm</td></tr>
          <tr><td>L</td><td>116 cm</td><td>110 cm</td><td>65 cm</td></tr>
          <tr><td>XL</td><td>122 cm</td><td>116 cm</td><td>66 cm</td></tr>
        </tbody></table>`;
    });
  }, 2200);
</script>
